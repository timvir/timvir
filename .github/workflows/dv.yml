name: Deployment Verification

on: deployment_status

env:
  URNERYS: app.urnerys.dev
  BUILD: "github-run-${{ github.run_id }}-${{ github.run_attempt }}"

permissions:
  contents: read

jobs:
  vst:
    name: Visual Smoke Test
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.14.0

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.1.1

      - run: pnpm install
      - run: ./node_modules/.bin/playwright install --with-deps chromium webkit

      - run: ../node_modules/.bin/playwright test
        working-directory: vst
        env:
          URL: ${{ github.event.deployment_status.target_url }}
          DEPLOYMENT_ENVIRONMENT: ${{ github.event.deployment_status.environment }}
